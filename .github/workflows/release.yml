name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        # Use the merged PR's description as the notes; generated changelog link is appended
        run: |
          body=$(gh pr list --state merged --search "${{ github.sha }}" --json body --jq '.[0].body // ""')
          gh release create "${{ github.ref_name }}" --notes "$body" --generate-notes
