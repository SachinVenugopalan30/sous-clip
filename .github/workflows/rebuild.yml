name: Weekly rebuild

# Rebuild the latest release with fresh dependencies so :latest picks up new yt-dlp
# versions (Instagram/TikTok extraction breaks often). Accepted cost: a full uncached
# multi-arch build every week.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check out latest release tag
        id: tag
        run: |
          tag=$(git describe --tags --abbrev=0)
          git checkout "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          no-cache: true # a cached uv pip install layer would keep the old yt-dlp
          build-args: APP_VERSION=${{ steps.tag.outputs.tag }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          tags: ghcr.io/sachinvenugopalan30/sous-clip:latest
