# Local build plus a Mealie to test against. Run from the repo root:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
services:
  app:
    pull_policy: build # build from source instead of pulling the published image
  worker:
    pull_policy: build

  mealie:
    image: docker.io/hkotel/mealie:latest
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      - ALLOW_SIGNUP=true
      - TZ=America/New_York
      - BASE_URL=http://localhost:9925
    volumes:
      - mealie-data:/app/data
    restart: unless-stopped

volumes:
  mealie-data:
