services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    depends_on:
      valkey:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    volumes:
      - app-data:/app/data
    restart: unless-stopped
    networks:
      - default

  # temporalio/auto-setup is deprecated (last tag 1.29.7). The server image does not set up its
  # database or the "default" namespace, so two one-shot admin-tools steps do it (both idempotent).
  # setup-schema errors once tables exist (hence || true); update-schema fails if setup really failed.
  # If either one-shot fails, check: docker compose logs temporal-schema temporal-namespace
  temporal-schema:
    image: docker.io/temporalio/admin-tools:1.32.2
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for db in temporal visibility; do
          name=temporal; [ "$$db" = visibility ] && name=temporal_visibility
          t="temporal-sql-tool --plugin postgres12 --ep temporal-db -p 5432 -u temporal -pw temporal --db $$name"
          $$t create
          $$t setup-schema -v 0.0 || true
          $$t update-schema -d /etc/temporal/schema/postgresql/v12/$$db/versioned
        done
    depends_on:
      temporal-db:
        condition: service_healthy
    restart: on-failure:5

  temporal:
    image: docker.io/temporalio/server:1.32.2
    expose:
      - "7233"
    environment:
      - DB=postgres12
      - POSTGRES_SEEDS=temporal-db
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - DYNAMIC_CONFIG_FILE_PATH=/dev/null # the image ships no dynamic config file; none needed
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "nc -z $$(hostname -i) 7233"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    restart: unless-stopped

  temporal-namespace:
    image: docker.io/temporalio/admin-tools:1.32.2
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    entrypoint: ["/bin/sh", "-c"]
    command:
      - temporal operator namespace describe -n default >/dev/null 2>&1 || temporal operator namespace create -n default --retention 24h
    depends_on:
      temporal:
        condition: service_healthy
    restart: on-failure:5

  temporal-db:
    image: docker.io/library/postgres:16-alpine
    environment:
      - POSTGRES_USER=temporal
      - POSTGRES_PASSWORD=temporal
      - POSTGRES_DB=temporal
    volumes:
      - temporal-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  valkey:
    image: docker.io/valkey/valkey:8-alpine
    expose:
      - "6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  worker:
    build: .
    command: python -m backend.worker
    env_file: .env
    environment:
      - WHISPER_MODELS_DIR=/app/models
    depends_on:
      valkey:
        condition: service_healthy
      temporal-namespace:
        condition: service_completed_successfully
    volumes:
      - app-data:/app/data
      - ./data/whisper-models:/app/models:ro,z
    restart: unless-stopped

  # --- Mealie (for local testing) ---
  mealie:
    image: docker.io/hkotel/mealie:latest
    ports:
      - "127.0.0.1:9925:9000"
    environment:
      - ALLOW_SIGNUP=true
      - TZ=America/New_York
      - BASE_URL=http://localhost:9925
    volumes:
      - mealie-data:/app/data
    restart: unless-stopped

volumes:
  app-data:
  temporal-data:
  valkey-data:
  mealie-data:
