[project]
name = "sous-clip"
version = "0.1.0"
description = "Self-hosted recipe extractor for short-form cooking videos"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.48",
    "pydantic-settings>=2.16.2",
    "yt-dlp>=2026.10.26",
    "faster-whisper>=1.2.1",
    "httpx>=0.28.1",
    "anthropic>=2.6",
    "openai>=3.46",
    "temporalio>=1.9.0",
    "redis>=8.1",
    "sse-starlette>=3.7",
    "python-jose[cryptography]>=3.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-instrumentation-fastapi>=0.66b2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.2",
    "pytest-asyncio>=1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
# Temporary: hold these at their current major line so the later bump tasks are real upgrades.
# Those tasks remove the matching entries (and this section once empty).
constraint-dependencies = [
    "temporalio<=1.35.0",
]
